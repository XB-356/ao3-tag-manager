<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock AO3 Filters</title>
    <style>
      body { font-family: Georgia, serif; margin: 0; background: #fff; color: #2a2a2a; }
      #header { background: #900; color: #fff; padding: 10px 18px; }
      #main { padding: 16px 18px; }
      .filters { border: 1px solid #ddd; padding: 10px; margin: 12px 0; }
      label { display: block; margin: 6px 0; }
      h2 { margin: 0 0 8px; }
      ul { margin: 6px 0; }
    </style>
  </head>
  <body>
    <div id="header">
      <a href="/">Fandoms</a> | <a href="/browse">Browse</a> | <a href="/search">Search</a> |
      <a href="/about">About</a> | <a href="/login">Log In</a>
    </div>
    <div id="main">
      <h2>Works</h2>

      <!-- 应被汉化的界面文案 -->
      <div class="filters" id="filter-area">
        <h3>Sort and Filter</h3>
        <label>Rating
          <select>
            <option>Not Rated</option>
            <option>General Audiences</option>
            <option>Teen And Up Audiences</option>
          </select>
        </label>
        <label>Warnings
          <select>
            <option>No Archive Warnings Apply</option>
            <option>Creator Chose Not To Use Archive Warnings</option>
          </select>
        </label>
        <label>Categories
          <select>
            <option>Any</option>
            <option>F/M</option>
            <option>Gen</option>
          </select>
        </label>
        <button type="button">Filters</button>
        <button type="button">Clear Filters</button>
        <input type="search" placeholder="Search within results" />
        <p>4 Works in Mock Fandom</p>
        <p>Words: 45,608 &middot; Kudos: 320 &middot; Hits: 12,004</p>
      </div>

      <!-- 用户内容：必须原样保留 -->
      <div id="workskin">
        <p id="user-body">The quick brown fox says: Words: 999 and Search for nothing.</p>
      </div>
      <blockquote class="summary" id="user-summary">Summary: this is the author's own summary text.</blockquote>
      <p id="tag-text">Fluff, Angst, Coffee Shop AU</p>
      <p id="author-text">by writer_alpha</p>
    </div>
  </body>
</html>
